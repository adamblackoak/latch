[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latch-boundary"
version = "0.1.0"
description = "A governed adoption and reliance boundary for AI-generated judgements."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Black Oak Projects"}]
keywords = ["ai-governance", "assurance", "agentic-ai", "reliance", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
latch = "latch_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
